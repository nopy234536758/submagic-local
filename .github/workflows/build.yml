name: Build Submagic Local (All platforms)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
      - name: Install Python dependencies
        run: |
          pip install -r src/requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller (onedir)
        run: |
          pyinstaller --onedir --name SubmagicLocal --add-data "src:src" src/app.py
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          wget -c https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p SubmagicLocal.AppDir/usr/bin
          cp -r dist/SubmagicLocal/* SubmagicLocal.AppDir/usr/bin/
          cat > SubmagicLocal.AppDir/SubmagicLocal.desktop << EOF
          [Desktop Entry]
          Name=Submagic Local
          Exec=SubmagicLocal
          Icon=submagic
          Type=Application
          Categories=Video;
          EOF
          touch SubmagicLocal.AppDir/submagic.png
          cat > SubmagicLocal.AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\$HERE/usr/bin/SubmagicLocal" "\$@"
          APPRUN
          chmod +x SubmagicLocal.AppDir/AppRun
          ./appimagetool-x86_64.AppImage SubmagicLocal.AppDir SubmagicLocal.AppImage
      - name: Upload AppImage to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SubmagicLocal.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r src/requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name SubmagicLocal --add-data "src;src" src/app.py
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SubmagicLocal.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          brew install ffmpeg
      - name: Install Python dependencies
        run: |
          pip install -r src/requirements.txt
          pip install pyinstaller
      - name: Build macOS app
        run: |
          pyinstaller --onefile --windowed --name SubmagicLocal --add-data "src:src" src/app.py
      - name: Compress macOS app bundle
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          zip -r SubmagicLocal-macos.zip dist/SubmagicLocal
      - name: Upload macOS bundle to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SubmagicLocal-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
