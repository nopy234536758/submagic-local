name: Build Submagic Local (All platforms)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # LINUX — AppImage léger via --onedir + nettoyage des libs CUDA inutiles
  # LINUX — Lightweight AppImage via --onedir + cleanup of unused CUDA libs
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # FR : Python 3.11 recommandé — meilleur support PyInstaller/torch que 3.12
          # EN : Python 3.11 recommended — better PyInstaller/torch support than 3.12
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg binutils

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # FR : Installer torch CPU-only en premier pour éviter ~3 Go de libs CUDA.
          #      whisperx doit être installé APRÈS torch pour réutiliser ce build CPU.
          # EN : Install CPU-only torch first to avoid ~3 GB of CUDA libraries.
          #      whisperx must be installed AFTER torch to reuse this CPU build.
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install whisperx
          pip install -r src/requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onedir)
        run: |
          # FR : --onedir crée un dossier au lieu d'un seul fichier.
          #      Plus rapide au démarrage et plus stable avec les libs natives.
          #      --copy-metadata est requis pour imageio/moviepy qui appellent
          #      importlib.metadata.version() à l'import — sans ça, crash immédiat.
          # EN : --onedir creates a folder instead of a single file.
          #      Faster startup and more stable with native libraries.
          #      --copy-metadata is required for imageio/moviepy which call
          #      importlib.metadata.version() on import — without this, instant crash.
          pyinstaller \
            --onedir \
            --name SubmagicLocal \
            --add-data "src:src" \
            --add-data "assets:assets" \
            --add-data "fonts:fonts" \
            --copy-metadata imageio \
            --copy-metadata moviepy \
            --copy-metadata numpy \
            --copy-metadata whisperx \
            --exclude-module matplotlib \
            --exclude-module tkinter \
            --exclude-module unittest \
            src/app.py

      - name: Strip & remove CUDA/test bloat
        run: |
          # FR : PyInstaller embarque parfois des .so CUDA résiduels même avec torch CPU.
          #      Cette étape les supprime pour réduire la taille finale (~1 Go économisé).
          # EN : PyInstaller sometimes bundles residual CUDA .so files even with CPU torch.
          #      This step removes them to reduce the final size (~1 GB saved).
          find dist/SubmagicLocal -name "*.so" -path "*/torch/lib/libcuda*"    -delete 2>/dev/null || true
          find dist/SubmagicLocal -name "*.so" -path "*/torch/lib/libnvidia*"  -delete 2>/dev/null || true
          find dist/SubmagicLocal -name "libcublas*"   -delete 2>/dev/null || true
          find dist/SubmagicLocal -name "libcufft*"    -delete 2>/dev/null || true
          find dist/SubmagicLocal -name "libcurand*"   -delete 2>/dev/null || true
          find dist/SubmagicLocal -name "libcusolver*" -delete 2>/dev/null || true
          find dist/SubmagicLocal -name "libcusparse*" -delete 2>/dev/null || true
          echo "FR : Taille finale du bundle / EN : Final bundle size : $(du -sh dist/SubmagicLocal | cut -f1)"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p SubmagicLocal.AppDir/usr/bin
          cp -r dist/SubmagicLocal/* SubmagicLocal.AppDir/usr/bin/

          # FR : Utilise l'icône du projet si elle existe, sinon génère un PNG minimal valide.
          #      appimagetool exige un fichier icône — sans lui, le build échoue silencieusement.
          # EN : Use the project icon if it exists, otherwise generate a minimal valid PNG.
          #      appimagetool requires an icon file — without it, the build fails silently.
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png SubmagicLocal.AppDir/submagic.png
          else
            python3 -c "
          import base64, pathlib
          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==')
          pathlib.Path('SubmagicLocal.AppDir/submagic.png').write_bytes(png)
          "
          fi

          cat > SubmagicLocal.AppDir/SubmagicLocal.desktop << 'EOF'
          [Desktop Entry]
          Name=Submagic Local
          Exec=SubmagicLocal
          Icon=submagic
          Type=Application
          Categories=Video;AudioVideo;
          EOF

          # FR : AppRun est le point d'entrée de l'AppImage.
          #      LD_LIBRARY_PATH doit pointer vers usr/bin où sont les .so bundlés.
          # EN : AppRun is the AppImage entry point.
          #      LD_LIBRARY_PATH must point to usr/bin where bundled .so files live.
          cat > SubmagicLocal.AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/bin:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/SubmagicLocal" "$@"
          APPRUN
          chmod +x SubmagicLocal.AppDir/AppRun

          ./appimagetool-x86_64.AppImage SubmagicLocal.AppDir SubmagicLocal-linux-x86_64.AppImage

      - name: Upload AppImage to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SubmagicLocal-linux-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # WINDOWS — EXE avec métadonnées imageio/moviepy incluses
  # WINDOWS — EXE with imageio/moviepy metadata included
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # FR : Même ordre que Linux — torch CPU avant whisperx et requirements.
          # EN : Same order as Linux — CPU torch before whisperx and requirements.
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install whisperx
          pip install -r src/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          # FR : --onefile produit un seul .exe (extraction dans %TEMP% au lancement).
          #      --windowed supprime la console noire au démarrage.
          #      Séparateur des --add-data est ";" sur Windows (vs ":" sur Unix).
          # EN : --onefile produces a single .exe (extracts to %TEMP% on launch).
          #      --windowed suppresses the black console window on startup.
          #      --add-data separator is ";" on Windows (vs ":" on Unix).
          pyinstaller `
            --onefile `
            --windowed `
            --name SubmagicLocal `
            --add-data "src;src" `
            --add-data "assets;assets" `
            --add-data "fonts;fonts" `
            --copy-metadata imageio `
            --copy-metadata moviepy `
            --copy-metadata numpy `
            --copy-metadata whisperx `
            --exclude-module matplotlib `
            --exclude-module tkinter `
            --exclude-module unittest `
            src/app.py

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SubmagicLocal.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # macOS — .app bundle signé ad-hoc pour éviter le blocage Gatekeeper
  # macOS — .app bundle with ad-hoc signing to bypass Gatekeeper block
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: brew install ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # FR : Sur macOS, torch CPU évite aussi les dépendances Metal/MPS inutiles.
          # EN : On macOS, CPU torch also avoids unnecessary Metal/MPS dependencies.
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install whisperx
          pip install -r src/requirements.txt
          pip install pyinstaller

      - name: Build macOS .app
        run: |
          # FR : --onedir est préférable à --onefile sur macOS — plus stable avec
          #      les frameworks natifs (Tk, AVFoundation, etc.).
          #      --osx-bundle-identifier est requis pour codesign.
          # EN : --onedir is preferred over --onefile on macOS — more stable with
          #      native frameworks (Tk, AVFoundation, etc.).
          #      --osx-bundle-identifier is required for codesign.
          pyinstaller \
            --onedir \
            --windowed \
            --name SubmagicLocal \
            --add-data "src:src" \
            --add-data "assets:assets" \
            --add-data "fonts:fonts" \
            --copy-metadata imageio \
            --copy-metadata moviepy \
            --copy-metadata numpy \
            --copy-metadata whisperx \
            --exclude-module matplotlib \
            --exclude-module tkinter \
            --exclude-module unittest \
            --osx-bundle-identifier com.submagic.local \
            src/app.py

      - name: Sign app ad-hoc
        run: |
          # FR : La signature ad-hoc (identité "-") n'est pas un certificat Apple Developer.
          #      Elle empêche Gatekeeper d'afficher "app endommagée" sans nécessiter
          #      de compte Apple payant. L'utilisateur devra quand même faire
          #      clic droit > Ouvrir la première fois sur macOS 13+.
          # EN : Ad-hoc signing (identity "-") is not an Apple Developer certificate.
          #      It prevents Gatekeeper from showing "app is damaged" without requiring
          #      a paid Apple account. The user will still need to right-click > Open
          #      the first time on macOS 13+.
          codesign --force --deep --sign - dist/SubmagicLocal.app

      - name: Compress macOS app bundle
        run: |
          cd dist
          zip -r ../SubmagicLocal-macos.zip SubmagicLocal.app

      - name: Upload macOS bundle to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SubmagicLocal-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
